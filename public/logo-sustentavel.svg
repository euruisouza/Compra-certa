<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sustentavelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5A32"/>
      <stop offset="50%" stop-color="#118447"/>
      <stop offset="100%" stop-color="#15A255"/>
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadowSustentavel" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#073B20" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container with rounded smooth corners -->
  <rect width="512" height="512" rx="120" fill="url(#sustentavelBg)"/>

  <!-- Organic ambient glow ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  <circle cx="256" cy="256" r="170" fill="#FFFFFF" fill-opacity="0.05"/>

  <!-- Cart with Eco Sprouting Leaves & Checkmark -->
  <g transform="translate(48, 48) scale(0.81)" filter="url(#shadowSustentavel)">
    <!-- Sprouting Organic Leaves rising from shopping basket -->
    <!-- Large primary leaf -->
    <path d="M 280 200 C 280 130 330 90 380 90 C 380 150 340 210 280 200 Z" 
          fill="url(#leafGrad1)"/>
    <path d="M 285 195 Q 330 145 375 95" 
          stroke="#064E3B" 
          stroke-width="5" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- Secondary complementary leaf -->
    <path d="M 270 210 C 230 170 235 120 270 100 C 295 130 295 180 270 210 Z" 
          fill="url(#leafGrad2)"/>
    <path d="M 268 200 Q 260 150 268 105" 
          stroke="#065F46" 
          stroke-width="4" 
          stroke-linecap="round" 
          fill="none"/>

    <!-- Shopping Cart Tubular Body -->
    <path d="M 60 120 L 110 120 L 165 340 L 400 340 L 450 190 L 175 190" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Inner Basket Organic Grid lines -->
    <path d="M 235 205 L 225 325 M 295 210 L 290 325 M 355 205 L 350 325 M 180 255 L 430 255" 
          stroke="#E6F4EA" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-opacity="0.85"/>

    <!-- Lower chassis base -->
    <path d="M 145 390 L 385 390" 
          stroke="#FFFFFF" 
          stroke-width="20" 
          stroke-linecap="round"/>

    <!-- Heavy durable eco cart wheels -->
    <g transform="translate(180, 410)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="15" fill="#118447"/>
    </g>
    <g transform="translate(355, 410)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="15" fill="#118447"/>
    </g>

    <!-- Circular Seal / Badge with Right Choice Checkmark -->
    <circle cx="395" cy="145" r="56" fill="#FFFFFF" filter="url(#shadowSustentavel)"/>
    <circle cx="395" cy="145" r="46" fill="#EAF7EE"/>
    <path d="M 372 145 L 389 162 L 420 128" 
          fill="none" 
          stroke="#118447" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
